<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f8f6" />
    <meta
      name="description"
      content="Простой список задач, который сохраняется в браузере."
    />
    <title>Список задач</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="task-panel" aria-labelledby="page-title">
        <header class="app-header">
          <div class="header-copy">
            <h1 id="page-title">Список задач</h1>
            <p class="date" id="current-date"></p>
            <p class="task-summary" id="task-summary" aria-live="polite"></p>
          </div>

          <div class="header-progress" aria-hidden="true">
            <strong id="progress-number">0 / 0</strong>
            <span>готово сегодня</span>
          </div>

          <svg class="header-checks" aria-hidden="true" viewBox="0 0 240 96">
            <path d="M42 24h153M42 48h118M42 72h139" />
            <path class="check-one" d="m12 24 7 7 13-15" />
            <path class="check-two" d="m12 48 7 7 13-15" />
            <circle cx="20" cy="72" r="9" />
          </svg>
        </header>

        <div class="task-workspace">
          <form class="task-form" id="task-form" novalidate>
            <label class="sr-only" for="task-input">Новая задача</label>
            <input
              id="task-input"
              name="task"
              type="text"
              maxlength="160"
              placeholder="Что нужно сделать?"
              autocomplete="off"
              required
              aria-describedby="form-message"
            />
            <button class="add-button" type="submit">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <path d="M12 5v14M5 12h14" />
              </svg>
              <span>Добавить</span>
            </button>
            <div class="task-schedule" aria-label="Срок выполнения">
              <label>
                <span>Дата</span>
                <input id="task-date" name="date" type="date" aria-describedby="form-message" />
              </label>
              <label>
                <span>Время</span>
                <input id="task-time" name="time" type="time" />
              </label>
            </div>
          </form>
          <p class="form-message" id="form-message" aria-live="polite"></p>

          <div class="list-heading">
            <h2>Мои задачи</h2>
            <span id="completion-label"></span>
          </div>

          <div class="task-filters" id="task-filters" aria-label="Фильтр задач">
            <button type="button" data-filter="all" aria-pressed="true">
              Все <span id="all-count">0</span>
            </button>
            <button type="button" data-filter="active" aria-pressed="false">
              Активные <span id="active-count">0</span>
            </button>
            <button type="button" data-filter="completed" aria-pressed="false">
              Выполненные <span id="completed-count">0</span>
            </button>
          </div>

          <div
            class="task-progress"
            id="task-progress"
            role="progressbar"
            aria-label="Прогресс выполнения задач"
            aria-valuemin="0"
            aria-valuemax="0"
            aria-valuenow="0"
          >
            <span></span>
          </div>

          <ul class="task-list" id="task-list" aria-label="Задачи"></ul>

          <div class="empty-state" id="empty-state" hidden>
            <div class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M8 6h11M8 12h11M8 18h7" />
                <path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2" />
              </svg>
            </div>
            <h2 id="empty-title">Задач пока нет</h2>
            <p id="empty-message">Добавьте первую задачу — она сохранится даже после обновления страницы.</p>
          </div>
        </div>
      </section>
    </main>

    <dialog class="edit-dialog" id="edit-dialog" aria-labelledby="edit-dialog-title">
      <form class="edit-form" id="edit-form" novalidate>
        <div class="dialog-header">
          <div>
            <h2 id="edit-dialog-title">Изменить задачу</h2>
          </div>
          <button class="dialog-close" id="dialog-close" type="button" aria-label="Закрыть окно">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <label for="edit-input">Название задачи</label>
        <textarea
          id="edit-input"
          name="task"
          rows="3"
          maxlength="160"
          required
          aria-describedby="edit-message"
        ></textarea>
        <div class="edit-schedule" aria-label="Срок выполнения">
          <label>
            <span>Дата</span>
            <input id="edit-date" name="date" type="date" aria-describedby="edit-message" />
          </label>
          <label>
            <span>Время</span>
            <input id="edit-time" name="time" type="time" />
          </label>
        </div>
        <p class="form-message edit-message" id="edit-message" aria-live="polite"></p>

        <div class="dialog-actions">
          <button class="secondary-button" id="edit-cancel" type="button">Отмена</button>
          <button class="primary-button" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <dialog class="edit-dialog delete-dialog" id="delete-dialog" aria-labelledby="delete-dialog-title">
      <form class="edit-form delete-form" id="delete-form">
        <div class="dialog-header">
          <div>
            <h2 id="delete-dialog-title">Удалить задачу?</h2>
          </div>
          <button
            class="dialog-close"
            id="delete-dialog-close"
            type="button"
            aria-label="Закрыть окно"
          >
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <p class="delete-dialog-copy">
          Вы действительно хотите удалить задачу «<strong id="delete-task-name"></strong>»?
          Её можно будет вернуть в течение пяти секунд.
        </p>

        <div class="dialog-actions">
          <button class="secondary-button" id="delete-cancel" type="button">Отмена</button>
          <button class="danger-button" type="submit">Удалить</button>
        </div>
      </form>
    </dialog>

    <div class="undo-bar" id="undo-bar" role="status" hidden>
      <span class="undo-message">
        <span class="undo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="m7 12 3 3 7-7" />
          </svg>
        </span>
        <span>Задача удалена</span>
      </span>
      <button id="undo-button" type="button">Вернуть</button>
    </div>
  </body>
</html>
